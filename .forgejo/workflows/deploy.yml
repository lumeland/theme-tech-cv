name: Publish on Codeberg Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Codeberg Pages
    runs-on: codeberg-small
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: https://github.com/pnpm/action-setup@v6

      - name: Setup Node.js
        uses: https://github.com/actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Build site
        run: pnpm lume build --location=https://lume.codeberg.page/theme-tech-cv
      - uses: https://codeberg.org/git-pages/action@v2
        with:
          site: "https://lume.codeberg.page/theme-tech-cv"
          token: ${{ forge.token }}
          source: _site/
